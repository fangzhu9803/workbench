<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的工作台</title>
<meta name="theme-color" content="#e0f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --c-bg:#f4faf6;
  --c-card:#ffffff;
  --c-text:#2d2d3a;
  --c-green-soft:#e8f5ee;
  --c-green:#86efac;
  --c-green-deep:#16a34a;
  --c-amber:#fbbf24;
  --c-rose:#fda4af;
  --c-orange:#fdba74;
  --c-blue:#93c5fd;
  --c-yellow:#fde68a;
  --c-pink:#fbcfe8;
  --c-lavender:#ddd6fe;
}
html,body{-webkit-tap-highlight-color:transparent;overflow:hidden;height:100%;}
body{background:var(--c-bg);color:var(--c-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}

/* === 全局：纸质纹理叠加 === */
html,body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.78;
  /* 纸纹噪点 + 斑驳 */
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.72  0 0 0 0 0.68  0 0 0 0 0.58  0 0 0 0.32 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:multiply;
}

/* === 总览：参考图1水彩笔刷——蓝/绿/黄/奶油色块，有机毛边 === */
#panel-overview{
  position:relative;
  background:#faf5e8;
  min-height:100%;
  overflow:hidden;
}
/* 多个水彩笔刷色块，小blur保留毛边 */
#panel-overview::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    /* 蓝色块（天空，左上） */
    radial-gradient(ellipse 320px 240px at 12% 15%, #9ecde0 0%, #b3dceb 35%, transparent 60%),
    /* 绿色块（草地，中下偏右） */
    radial-gradient(ellipse 360px 280px at 55% 78%, #a8d49a 0%, #b4d99c 35%, transparent 62%),
    /* 深绿色块（左下草地） */
    radial-gradient(ellipse 300px 240px at 10% 88%, #7eb867 0%, #8ec275 35%, transparent 60%),
    /* 黄色块（中间明亮） */
    radial-gradient(ellipse 340px 120px at 52% 50%, #d9ca5e 0%, #e3d97a 50%, transparent 72%);
  filter:blur(1.5px) contrast(1.08);
  opacity:.9;
}
/* 第二层水彩笔触——细条状，保留毛边 */
#panel-overview::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 220px 55px at 60% 65%, #9ecf82 0%, transparent 68%),
    radial-gradient(ellipse 260px 65px at 42% 70%, #c5d05a 0%, transparent 68%),
    radial-gradient(ellipse 200px 50px at 55% 73%, #7eb867 0%, transparent 68%),
    radial-gradient(ellipse 180px 48px at 25% 40%, #8ec5dc 0%, transparent 68%);
  filter:blur(1px);
  opacity:.8;
}
#panel-overview .card{
  background:rgba(255,253,247,.85);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 6px 24px rgba(95,108,80,.12);
}

/* === 其余面板：水彩纸纹底（柔和色块点缀） === */
.panel-section:not(#panel-overview){
  position:relative;
  background:#faf5e8;
  min-height:100%;
}
.panel-section:not(#panel-overview)::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 280px 300px at 8% 92%, #d4c85e 0%, #e3d97a 35%, transparent 60%),
    radial-gradient(ellipse 260px 280px at 90% 10%, #9ec5dc 0%, #b3dceb 35%, transparent 60%),
    radial-gradient(ellipse 280px 300px at 92% 92%, #9ecf82 0%, #b4d99c 35%, transparent 60%);
  filter:blur(1.5px);
  opacity:.5;
}
.panel-section:not(#panel-overview) .card{
  background:rgba(255,253,247,.85);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 6px 24px rgba(95,108,80,.12);
}

.main-panel{padding-left:44px;height:100vh;min-height:100%;}
.panel-section{animation:fade .25s ease;position:relative;min-height:100%;padding-bottom:60px;}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.card{position:relative;z-index:1;border-radius:22px;box-shadow:0 6px 24px rgba(22,101,52,.06);}
.panel-header{position:relative;z-index:1;}

/* 创意打卡圆圈 */
.check-circle{width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);border:2.5px solid #e2e8f0;background:#fff;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.06);}
/* 未完成时是白色泡泡，3D玻璃感 */
.check-circle:not(.done){
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.7) 50%, rgba(241,245,249,.5) 100%);
  box-shadow:inset 2px 2px 6px rgba(255,255,255,.9),inset -3px -3px 8px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);
}
.check-circle:active{transform:scale(.92);}
/* 已完成：保持彩色底色 + 玻璃光泽 */
.check-circle.done{
  transform:translateY(-4px) scale(1.05);
  box-shadow:0 8px 22px rgba(0,0,0,.18),inset 3px 3px 8px rgba(255,255,255,.35),inset -3px -3px 8px rgba(0,0,0,.1);
  border-color:transparent;
}
.check-circle .check-emoji{font-size:26px;transition:transform .2s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.1));}
.check-circle.done .check-emoji{display:none;}
/* 已完成时不显示手绘图标——保持纯泡泡 */
.check-circle .check-done{font-size:24px;display:none;}
.check-circle.done .check-done{display:none;}
.check-circle .check-label{font-size:10px;margin-top:2px;font-weight:600;}
/* 已完成时标签白色（玻璃泡泡上的文字） */
.check-circle.done .check-label{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:700;}
/* 未完成时暗色 */
.check-circle:not(.done) .check-label{color:#334155;}
/* 已完成：彩色渐变（玻璃底色） */
.check-circle:nth-child(6n+1){border-color:#fecdd3;}
.check-circle:nth-child(6n+1).done{background:radial-gradient(circle at 35% 30%, #fb7185 0%, #f43f5e 60%, #be123c 100%);}
.check-circle:nth-child(6n+2){border-color:#fed7aa;}
.check-circle:nth-child(6n+2).done{background:radial-gradient(circle at 35% 30%, #fdba74 0%, #fb923c 60%, #c2410c 100%);}
.check-circle:nth-child(6n+3){border-color:#fde68a;}
.check-circle:nth-child(6n+3).done{background:radial-gradient(circle at 35% 30%, #fde047 0%, #facc15 60%, #a16207 100%);}
.check-circle:nth-child(6n+4){border-color:#bbf7d0;}
.check-circle:nth-child(6n+4).done{background:radial-gradient(circle at 35% 30%, #86efac 0%, #4ade80 60%, #15803d 100%);}
.check-circle:nth-child(6n+5){border-color:#a5f3fc;}
.check-circle:nth-child(6n+5).done{background:radial-gradient(circle at 35% 30%, #7dd3fc 0%, #38bdf8 60%, #0369a1 100%);}
.check-circle:nth-child(6n+6){border-color:#ddd6fe;}
.check-circle:nth-child(6n+6).done{background:radial-gradient(circle at 35% 30%, #c4b5fd 0%, #a78bfa 60%, #5b21b6 100%);}
.check-wave{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;padding:8px 0;}
.check-wave > .check-circle:nth-child(odd){transform:translateY(-4px) rotate(-1deg);}
.check-wave > .check-circle:nth-child(even){transform:translateY(4px) rotate(1deg);}
.check-wave > .check-circle.done:nth-child(odd),.check-wave > .check-circle.done:nth-child(even){transform:translateY(-8px) scale(1.08) rotate(0deg);}

/* === 便签列表 === */
.sticky-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.sticky-note{position:relative;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px 12px 44px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:all .2s;animation:stickyIn .3s ease;}
@keyframes stickyIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.sticky-note:hover{transform:translateX(2px);box-shadow:0 4px 14px rgba(0,0,0,.08);}
.sticky-note.done{background:#f0fdf4;border-color:#bbf7d0;opacity:.7;}
.sticky-note.done .sticky-label{text-decoration:line-through;color:#86efac;}
.sticky-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%) rotate(-6deg);width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.sticky-label{font-size:14px;font-weight:600;color:#1e293b;line-height:1.4;}
.sticky-note.done .sticky-icon svg path{fill:#86efac;}
.sticky-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#ef4444;background:#fef2f2;font-size:12px;opacity:.6;transition:all .15s;}
.sticky-del:hover{opacity:1;background:#fecaca;}
.sticky-add{display:flex;gap:8px;margin-top:12px;align-items:center;}
.sticky-add input{flex:1;padding:10px 14px;border-radius:10px;border:1px dashed #fde68a;background:#fffdf5;font-size:14px;color:#1e293b;outline:none;transition:all .15s;}
.sticky-add input:focus{border-color:#fbbf24;border-style:solid;background:#fff;}
.sticky-add button{padding:10px 18px;border-radius:10px;background:#fef3c7;color:#92400e;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;}
.sticky-add button:hover{background:#fde68a;}

/* 运动chip */
.ex-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);border:2px solid transparent;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.ex-chip:hover{transform:translateY(-2px) rotate(-1deg);}
.ex-chip:active{transform:scale(.95);}
.ex-chip-off:nth-child(5n+1){border-color:#fecdd3;color:#e11d48;background:#fff1f2;}
.ex-chip-off:nth-child(5n+2){border-color:#fed7aa;color:#ea580c;background:#fff7ed;}
.ex-chip-off:nth-child(5n+3){border-color:#fde68a;color:#ca8a04;background:#fefce8;}
.ex-chip-off:nth-child(5n+4){border-color:#bbf7d0;color:#16a34a;background:#f0fdf4;}
.ex-chip-off:nth-child(5n+5){border-color:#a5f3fc;color:#0891b2;background:#ecfeff;}

.progress-track{background:#e8f0e8;border-radius:999px;}
input[type=range]{-webkit-appearance:none;height:6px;border-radius:6px;background:#fde68a;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fbbf24;box-shadow:0 2px 6px rgba(251,191,36,.3);cursor:pointer;border:3px solid #fff;}
.modal-bg{background:rgba(22,101,52,.12);backdrop-filter:blur(4px);}
textarea{resize:none;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#c4e8d0;border-radius:2px;}

.tag-success{background:#fef9c3;color:#854d0e;}
.tag-gratitude{background:#dcfce7;color:#166534;}
.tag-zhiji{background:#e9d5ff;color:#5b21b6;}

.diary-line{display:flex;align-items:baseline;border-bottom:1px solid #f1f5f9;min-height:42px;padding:0;position:relative;}
.diary-num{flex-shrink:0;width:36px;padding:10px 6px 10px 14px;font-size:14px;color:#86efac;font-weight:600;}
.diary-tag{flex-shrink:0;padding:10px 4px;}
.diary-tag span{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;}
.diary-text{flex:1;padding:10px 14px 10px 6px;font-size:13px;color:#1e293b;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.diary-time{flex-shrink:0;padding:10px 14px 10px 4px;font-size:10px;color:#94a3b8;}

/* 左侧Tab */
.side-tabs{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:4px;padding:6px 5px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 6px 22px rgba(22,101,52,.10),0 2px 6px rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8);transition:transform .25s ease;}
.side-tabs.collapsed{transform:translate(calc(-100% + 12px),-50%);}
.side-tabs.collapsed .side-tab-label{display:none;}
.side-tabs.collapsed .side-tab{justify-content:center;padding:5px 2px;}
.side-tabs .side-tab-btn{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:18px;height:36px;border-radius:0 8px 8px 0;background:rgba(255,255,255,.9);border:1px solid rgba(22,101,52,.08);border-left:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#86efac;font-size:10px;box-shadow:3px 0 8px rgba(22,101,52,.08);transition:all .2s;}
.side-tabs.collapsed .side-tab-btn{transform:translateY(-50%) rotate(180deg);}
.side-tab{display:flex;align-items:center;gap:3px;padding:5px 6px;border-radius:10px;cursor:pointer;transition:all .15s;color:#94a3b8;font-size:10px;font-weight:500;background:rgba(255,255,255,.5);}
.side-tab.active{background:linear-gradient(135deg,#dcfce7,#e8f5ee);color:#16a34a;box-shadow:0 2px 6px rgba(22,101,52,.12);}
.side-tab:hover{background:#f0fdf4;transform:translateX(1px);}
.side-tab span:first-child{font-size:13px;}

.date-nav{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:1px solid #cbd5e1;background:#fff;color:#334155;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.date-nav:hover{background:#f0fdf4;color:#16a34a;}

.delete-btn{display:flex;opacity:.5;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:all .15s;position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#ef4444;background:#fef2f2;}
.delete-btn:hover{opacity:1;background:#fecaca;}
.delete-btn-small{width:20px;height:20px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:all .15s;color:#ef4444;background:#fef2f2;margin-left:4px;}
.delete-btn-small:hover{background:#fecaca;}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f1f5f9;transition:background .15s;position:relative;}
.item-row:last-child{border-bottom:none;}
.item-row:hover{background:#f8fafc;}
.notes-item{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid #f1f5f9;position:relative;transition:all .15s;}
.notes-item:hover{background:#f8fafc;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.notes-text{font-size:13px;color:#475569;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.notes-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:#94a3b8;}

.ex-record-card{border-radius:12px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;border:1px solid #bbf7d0;background:#f0fdf4;}
.ex-record-text{color:#166534;font-size:13px;}
.read-record{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fffbeb;border-radius:10px;margin-bottom:6px;border:1px solid #fde68a;}

.setting-btn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;border:1px solid #e2e8f0;background:#fff;color:#94a3b8;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.setting-btn:hover{background:#f0fdf4;color:#16a34a;}
.setting-btn.open{transform:rotate(90deg);background:#dcfce7;color:#16a34a;border-color:#bbf7d0;}
.mgmt-panel{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease,transform .3s ease;opacity:0;transform:translateY(-8px);}
.mgmt-panel.open{max-height:600px;opacity:1;transform:translateY(0);margin-top:16px;}

.book-tab{display:inline-flex;align-items:center;gap:4px;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid #e2e8f0;background:#fff;color:#64748b;}
.book-tab.active{background:#fffbeb;color:#ca8a04;border-color:#fde68a;}
.book-card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid #f1f5f9;}
.book-title{font-size:14px;font-weight:600;color:#334155;}
.book-min{font-size:12px;color:#94a3b8;}
.book-done{background:#f0fdf4;border-color:#bbf7d0;}

/* === 通用日历样式 === */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-bottom:4px;}
.cal-head div{font-size:10px;color:#94a3b8;padding:2px 0;}
.cal-cell{min-height:40px;border-radius:8px;text-align:center;padding:2px 1px;cursor:pointer;transition:all .15s;position:relative;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
.cal-cell.empty{cursor:default;}
.cal-cell.cal-today{ring:2px;box-shadow:0 0 0 2px #86efac;}
.cal-cell:not(.empty):hover{transform:scale(1.08);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.cal-day-num{font-size:10px;color:#94a3b8;line-height:1;}
.cal-marks{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;margin-top:1px;}
.cal-mark{width:6px;height:6px;border-radius:50%;}
.cal-mark.read{background:#fbbf24;}
.cal-mark.duo{background:#f472b6;}
.cal-weight-val{font-size:9px;font-weight:700;color:#16a34a;line-height:1.1;}
.cal-cell.selected{background:#fffbeb !important;border-color:#fbbf24 !important;box-shadow:0 0 0 2px #fbbf24;}
</style>
</head>
<body class="font-sans h-full">

<main class="main-panel flex-1 overflow-y-auto" id="mainContent">

  <!-- 总览 -->
  <div id="panel-overview" class="panel-section p-5 max-w-2xl mx-auto">
    <div class="panel-header">
      <h2 class="text-xl font-bold text-amber-600 mb-1">今日总览</h2>
      <p id="todayDateMain" class="text-sm text-slate-600 mb-4"></p>
    </div>
    <div class="card p-4 mb-4" style="border-top:4px solid #fbbf24;">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-slate-700">完成度</span>
        <div class="flex items-center gap-2">
          <span class="text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-500">🔥 <span id="streakDays">0</span>天</span>
          <span class="text-2xl font-bold text-amber-500" id="completionPctMain">0%</span>
        </div>
      </div>
      <div class="progress-track h-3 rounded-full overflow-hidden"><div id="completionBarMain" class="h-full rounded-full transition-all duration-500" style="width:0%;background:linear-gradient(90deg,#93c5fd,#86efac,#fde68a,#fdba74,#fbcfe8)"></div></div>
      <div id="miniSummary" class="flex flex-wrap gap-2 mt-3 text-xs"></div>
    </div>
    <div class="card p-4 mb-4" style="border-top:4px solid #fda4af;">
      <h3 class="text-sm font-semibold text-slate-600 mb-3">快速待办</h3>
      <div id="quickCheckGrid" class="check-wave"></div>
    </div>
    <div class="card p-4" style="border-top:4px solid #93c5fd;">
      <h3 class="text-sm font-semibold text-slate-600 mb-2">今日状态</h3>
      <div id="overviewStatus" class="space-y-1.5 text-sm"></div>
    </div>
  </div>

  <!-- 每日待办 -->
  <div id="panel-checkin" class="panel-section hidden p-5 max-w-2xl mx-auto">
    <div class="panel-header flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold" style="color:#e11d48;">每日待办</h2>
      <button class="setting-btn" id="checkSettingBtn" onclick="toggleCheckMgmt()">⚙️</button>
    </div>
    <div class="flex items-center gap-3 mb-4">
      <button class="date-nav" onclick="app.navCheck(-1)">←</button>

<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateOffset(base,off){const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+off);return dateStr(d);}
function fmtDate(s){const d=new Date(s+'T00:00:00');const w=['日','一','二','三','四','五','六'];return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w[d.getDay()];}
function fmtTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

const DIARY_TYPES={success:{label:'成功日记',emoji:'🎉',cls:'tag-success'},gratitude:{label:'感恩日记',emoji:'🙏',cls:'tag-gratitude'},zhiji:{label:'忽而知己',emoji:'💡',cls:'tag-zhiji'}};
const DEFAULT_EX_TYPES=[
  {key:'climb',label:'爬坡',emoji:'🧗',fields:[{key:'duration',label:'时长',unit:'min',type:'number',min:0,max:300,step:5,default:30},{key:'incline',label:'坡度',unit:'%',type:'number',min:0,max:20,step:1,default:10}]},
  {key:'swim',label:'游泳',emoji:'🏊',fields:[{key:'distance',label:'距离',unit:'m',type:'number',min:0,max:5000,step:50,default:1000},{key:'duration',label:'时长',unit:'min',type:'number',min:0,max:300,step:5,default:40}]},
  {key:'back',label:'练背',emoji:'💪',fields:[{key:'duration',label:'时长',unit:'min',type:'number',min:0,max:300,step:5,default:45},{key:'sets',label:'组数',unit:'组',type:'number',min:0,max:30,step:1,default:5}]}
];
const DEFAULT_CHECKS=[
  {key:'trash',label:'倒垃圾',emoji:'🗑'},
  {key:'breakfast',label:'做早餐',emoji:'🍳'},
  {key:'fishoil',label:'鱼油',emoji:'🐟'},
  {key:'vitamind',label:'维生素D',emoji:'☀️'},
  {key:'earlysleep',label:'早睡',emoji:'🌙'},
  {key:'kuaishou',label:'快手打卡',emoji:'📱'},
  {key:'hongguo',label:'红果打卡',emoji:'🍅'}
];
const DEFAULT_STUDY_ITEMS=[
  {key:'reading',label:'阅读',emoji:'📖'},
  {key:'duolingo',label:'多邻国',emoji:'🦉'}
];

// 已完成态为纯3D泡泡，无需图标

let vdCheck=todayStr(),vdEx=todayStr(),vdStudy=todayStr(),vdDiary=todayStr(),vdNotes=todayStr(),vdHist=todayStr();
let vdDiaryWeek=todayStr(),vdDiaryMonth=todayStr(),vdNotesWeek=todayStr(),vdNotesMonth=todayStr();
let diaryFilter='all',diaryModalType='success',diaryView='day',notesView='day',histTab='day',bookTab='reading';
let vdHistWeek=todayStr(),vdHistMonth=todayStr();
let vdWeightMonth=todayStr(),vdStudyMonth=todayStr();
let selWeightDate=todayStr(),selStudyDate=todayStr();

// ==================== 待办（原打卡） ====================
function getCheckItems(){return load('checkItems',DEFAULT_CHECKS);}
function setCheckItems(v){save('checkItems',v);}
function getChecks(date){const r=load('checkRecords',{});return r[date]||{};}
function setChecks(date,v){const r=load('checkRecords',{});r[date]=v;save('checkRecords',r);}
function toggleCheck(date,key){const c=getChecks(date);c[key]=!c[key];setChecks(date,c);if(c[key])confetti();}

// === 便签（按日期存储的待办事项列表） ===
function getStickies(date){const all=load('stickyNotes',{});return all[date]||[];}
function setStickies(date,v){const all=load('stickyNotes',{});all[date]=v;save('stickyNotes',all);}
function addSticky(){
  const inp=$('#newStickyInput');
  const text=inp.value.trim();
  if(!text)return;
  const list=getStickies(vdCheck);
  list.push({id:Date.now(),text,done:false});
  setStickies(vdCheck,list);
  inp.value='';
  renderStickies();
}
function toggleSticky(id){
  const list=getStickies(vdCheck);
  const it=list.find(x=>x.id===id);
  if(it){it.done=!it.done;setStickies(vdCheck,list);renderStickies();if(it.done)confetti();}
}
function deleteSticky(id){
  const list=getStickies(vdCheck).filter(x=>x.id!==id);
  setStickies(vdCheck,list);
  renderStickies();
}
const STICKY_ICON_SVG='<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 4h12l4 4v12H4z" fill="#fde68a" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 4v4h4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round"/><line x1="7" y1="11" x2="15" y2="11" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/><line x1="7" y1="14" x2="13" y2="14" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/></svg>';
function renderStickies(){
  const list=getStickies(vdCheck);
  let html='';
  list.forEach(it=>{
    html+=`<div class="sticky-note ${it.done?'done':''}">`;
    html+=`<div class="sticky-icon" onclick="toggleSticky(${it.id})">${STICKY_ICON_SVG}</div>`;
    html+=`<div class="sticky-label" onclick="toggleSticky(${it.id})">${escapeHtml(it.text)}</div>`;
    html+=`<div class="sticky-del" onclick="deleteSticky(${it.id})">✕</div>`;
    html+=`</div>`;
  });
  if(list.length===0){
    html='<p class="text-center text-sm text-slate-600 py-4">还没有便签，添加一条待办吧～</p>';
  }
  $('#stickyList').innerHTML=html;
}

let checkMgmtOpen=false;
function toggleCheckMgmt(){checkMgmtOpen=!checkMgmtOpen;$('#checkinRecords').classList.toggle('open',checkMgmtOpen);$('#checkSettingBtn').classList.toggle('open',checkMgmtOpen);renderCheckMgmt();}
let bookMgmtOpen=false;
function toggleBookMgmt(){bookMgmtOpen=!bookMgmtOpen;$('#bookMgmtArea').classList.toggle('open',bookMgmtOpen);$('#bookSettingBtn').classList.toggle('open',bookMgmtOpen);}
function renderCheckMgmt(){
  const items=getCheckItems();
  let mgmt='<div class="card p-4"><div class="flex items-center justify-between mb-3"><span class="text-sm font-medium text-slate-600">管理待办项</span></div>';
  items.forEach(item=>{mgmt+=`<div class="item-row"><div class="flex items-center gap-2"><span class="text-lg">${item.emoji}</span><span class="text-sm text-slate-600">${item.label}</span></div><div class="delete-btn-small" onclick="deleteCheckItem('${item.key}')">🗑</div></div>`;});
  mgmt+='<div class="flex gap-2 mt-3"><input id="newCheckEmoji" type="text" placeholder="🎯" maxlength="2" class="w-12 px-2 py-2 text-center rounded-lg border border-slate-200 text-sm"><input id="newCheckLabel" type="text" placeholder="待办项名称" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-sm"><button class="px-4 py-2 rounded-lg bg-rose-100 text-rose-500 text-sm font-medium hover:bg-rose-200 transition" onclick="addCheckItem()">添加</button></div></div>';
  $('#checkinRecords').innerHTML=mgmt;
}
function renderCheck(){
  const items=getCheckItems();
  const checks=getChecks(vdCheck);
  const doneCount=items.filter(i=>checks[i.key]).length;
  $('#checkinDateDisplay').textContent=fmtDate(vdCheck);
  $('#checkProgress').textContent=doneCount+'/'+items.length+' 已完成';
  $('#checkinHistoryHint').textContent=vdCheck===todayStr()?'':(checks&&Object.keys(checks).length?'已打卡 '+Object.keys(checks).length+' 项':'未打卡');
  let grid='';
  items.forEach(item=>{
    const done=checks[item.key];
    grid+=`<div class="check-circle ${done?'done':''}" onclick="toggleCheck('${vdCheck}','${item.key}');renderAll();"><div class="check-emoji">${item.emoji}</div><div class="check-label ${done?'text-white':'text-slate-600'}">${item.label}</div></div>`;
  });
  $('#checkGrid').innerHTML=grid;
  renderStickies();
  if(checkMgmtOpen)renderCheckMgmt();
}
function addCheckItem(){
  const emoji=$('#newCheckEmoji').value.trim()||'🎯';
  const label=$('#newCheckLabel').value.trim();
  if(!label)return;
  const items=getCheckItems();
  items.push({key:'c'+Date.now(),label,emoji});
  setCheckItems(items);
  $('#newCheckEmoji').value='';$('#newCheckLabel').value='';
  renderAll();
}
function deleteCheckItem(key){if(!confirm('确认删除这个待办项？'))return;setCheckItems(getCheckItems().filter(i=>i.key!==key));renderAll();}

// ==================== 运动 ====================
function getExTypes(){return load('exTypes',DEFAULT_EX_TYPES);}
function setExTypes(v){save('exTypes',v);}
function findExType(key){return getExTypes().find(x=>x.key===key)||{label:'未知',emoji:'❓',fields:[]};}
function getEx(date){const r=load('exRecords',{});return r[date]||[];}
function setEx(date,v){const r=load('exRecords',{});r[date]=v;save('exRecords',r);}
function addEx(type){const ex=getEx(vdEx);const t=findExType(type);const detail={};t.fields.forEach(f=>detail[f.key]=f.default);ex.push({type,detail,done:false});setEx(vdEx,ex);renderExercise();}
let exMgmtOpen=false;
function toggleExMgmt(){exMgmtOpen=!exMgmtOpen;$('#exMgmtArea').classList.toggle('open',exMgmtOpen);$('#exSettingBtn').classList.toggle('open',exMgmtOpen);renderExMgmt();}
function renderExMgmt(){
  const types=getExTypes();
  let mgmt='<div class="card p-4"><div class="flex items-center justify-between mb-3"><span class="text-sm font-medium text-slate-600">管理运动项</span></div>';
  types.forEach(item=>{mgmt+=`<div class="item-row"><div class="flex items-center gap-2"><span class="text-lg">${item.emoji}</span><span class="text-sm text-slate-600">${item.label}</span></div><div class="delete-btn-small" onclick="deleteExType('${item.key}')">🗑</div></div>`;});
  mgmt+='<div class="flex gap-2 mt-3"><input id="newExEmoji" type="text" placeholder="🎯" maxlength="2" class="w-12 px-2 py-2 text-center rounded-lg border border-slate-200 text-sm"><input id="newExLabel" type="text" placeholder="运动项名称（如：跑步）" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-sm"><button class="px-4 py-2 rounded-lg bg-green-100 text-green-500 text-sm font-medium hover:bg-green-200 transition" onclick="addExType()">添加</button></div>';
  mgmt+='<p class="text-xs text-slate-600 mt-2">新增运动项默认包含"时长"字段</p></div>';
  $('#exMgmtArea').innerHTML=mgmt;
}
function renderExercise(){
  const ex=getEx(vdEx);
  $('#exDateDisplay').textContent=fmtDate(vdEx);
  $('#exHistoryHint').textContent=vdEx===todayStr()?'':(ex.length?ex.length+' 项运动记录':'无运动记录');
  let tags='';
  getExTypes().forEach(t=>{tags+=`<span class="ex-chip ex-chip-off" onclick="addEx('${t.key}')">${t.emoji} ${t.label}</span>`;});
  $('#exTagList').innerHTML=tags;
  let details='';
  ex.forEach((e,idx)=>{
    if(e.done)return;
    const t=findExType(e.type);
    let fields=`<div class="card p-3" style="border-left:4px solid #86efac;"><div class="flex items-center justify-between mb-2"><span class="text-sm font-medium text-green-600">${t.emoji} ${t.label}</span><button class="text-xs text-red-400 hover:text-red-600" onclick="app.cancelEx('${vdEx}',${idx})">取消</button></div>`;
    if(t.fields.length===0){fields+='<p class="text-xs text-slate-600">休息日，好好放松～</p>';}
    else{t.fields.forEach(f=>{const val=e.detail[f.key]??f.default;fields+=`<div class="mb-2"><div class="flex justify-between text-xs text-slate-700 mb-1"><span>${f.label}</span><span id="exv_${idx}_${f.key}">${val}${f.unit}</span></div>`;if(f.type==='range')fields+=`<input type="range" id="exf_${idx}_${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}" class="w-full" oninput="$('#exv_${idx}_${f.key}').textContent=this.value+'${f.unit}'">`;else fields+=`<input type="number" id="exf_${idx}_${f.key}" value="${val}" min="${f.min}" max="${f.max}" step="${f.step}" class="w-full px-2 py-1 rounded border border-slate-200 text-sm">`;fields+='</div>';});}
    fields+=`<button class="w-full py-2 rounded-lg bg-green-100 text-green-600 text-sm font-medium hover:bg-green-200 transition" onclick="app.completeEx('${vdEx}',${idx})">完成 ✓</button></div>`;
    details+=fields;
  });
  $('#exDetailArea').innerHTML=details;
  let recs='';
  ex.filter(e=>e.done).forEach((e,idx)=>{const t=findExType(e.type);let txt=t.emoji+' '+t.label;if(t.fields.length>0)txt+='：'+t.fields.map(f=>e.detail[f.key]+f.unit).join(' / ');recs+=`<div class="ex-record-card"><span class="ex-record-text">${txt}</span><div class="delete-btn-small" onclick="app.deleteEx('${vdEx}',${getActualIdx(vdEx,e)})">🗑</div></div>`;});
  $('#exRecordsArea').innerHTML=recs;
  let weekMin=0,weekCount=0;
  for(let i=0;i<7;i++){const d=dateOffset(todayStr(),-i);getEx(d).forEach(e=>{if(e.done&&e.type!=='rest'){weekCount++;const t=findExType(e.type);const dur=t.fields.find(f=>f.key==='duration');if(dur)weekMin+=e.detail.duration||0;}});}
  $('#weekExerciseStat').textContent='本周运动 '+weekCount+' 次'+(weekMin?'，共 '+weekMin+' 分钟':'');
  if(exMgmtOpen)renderExMgmt();
}
function getActualIdx(date,e){return getEx(date).findIndex(x=>x===e);}
function addExType(){const emoji=$('#newExEmoji').value.trim()||'🎯';const label=$('#newExLabel').value.trim();if(!label)return;const types=getExTypes();types.push({key:'ex'+Date.now(),label,emoji,fields:[{key:'duration',label:'时长',unit:'min',type:'number',min:0,max:300,step:5,default:30}]});setExTypes(types);$('#newExEmoji').value='';$('#newExLabel').value='';renderExercise();}
function deleteExType(key){if(!confirm('确认删除这个运动项？历史记录不受影响。'))return;setExTypes(getExTypes().filter(i=>i.key!==key));renderExercise();}

// ==================== 体重记录（支持点击任意日期） ====================
function getWeights(){return load('weightRecords',{});}
function setWeights(v){save('weightRecords',v);}
function saveWeight(){
  const val=parseFloat($('#weightInput').value);
  if(!val||val<=0||val>500)return;
  const w=getWeights();
  w[selWeightDate]=val;
  setWeights(w);
  $('#weightInput').value='';
  renderWeightCalendar();
  renderWeightChart();
}
function deleteWeight(date){if(confirm('确认删除 '+date+' 的体重记录？')){const w=getWeights();delete w[date];setWeights(w);renderWeightCalendar();renderWeightChart();}}
function selectWeightDate(ds){
  selWeightDate=ds;
  renderWeightCalendar();
}
function renderWeightCalendar(){
  const d=new Date(vdWeightMonth+'T00:00:00');
  const y=d.getFullYear(),m=d.getMonth();
  $('#weightMonthDisplay').textContent=(m+1)+'月 '+y;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const weights=getWeights();
  let html='';
  for(let i=0;i<firstDay;i++)html+='<div class="cal-cell empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const w=weights[ds];
    const isToday=ds===todayStr();
    const isSel=ds===selWeightDate;
    let cls='cal-cell';
    if(isToday)cls+=' cal-today';
    if(isSel)cls+=' selected';
    if(w)cls+=' bg-green-50';
    else cls+=' bg-slate-50';
    html+=`<div class="${cls}" onclick="selectWeightDate('${ds}')" style="min-height:42px;">`;
    html+=`<div class="cal-day-num">${day}</div>`;
    if(w){
      html+=`<div class="cal-weight-val">${w}</div>`;
      html+=`<div class="text-red-300 text-[8px] cursor-pointer mt-0.5" onclick="event.stopPropagation();app.deleteWeight('${ds}')">✕</div>`;
    }
    html+='</div>';
  }
  $('#weightCalendar').innerHTML=html;
  // 更新底部选中日期信息
  const selW=weights[selWeightDate];
  const selDateObj=new Date(selWeightDate+'T00:00:00');
  const w=['日','一','二','三','四','五','六'];
  $('#weightCalSelDate').textContent=(selDateObj.getMonth()+1)+'月'+selDateObj.getDate()+'日 周'+w[selDateObj.getDay()];
  if(selW){
    $('#weightInput').value=selW;
    $('#weightSelInfo').textContent='当日已记录：'+selW+' kg';
  }else{
    $('#weightInput').value='';
    $('#weightSelInfo').textContent='当日暂无记录';
  }
  renderWeightChart();
}

// ==================== 体重折线图 ====================
function renderWeightChart(){
  const container=$('#weightChart');
  const rangeEl=$('#weightRangeDisplay');
  if(!container)return;
  const weights=getWeights();
  const days=[];
  for(let i=29;i>=0;i--)days.push(dateOffset(todayStr(),-i));
  const points=days.map(d=>({date:d,value:weights[d]})).filter(p=>p.value!=null);
  if(points.length>=2){
    const first=points[0].value,last=points[points.length-1].value;
    const diff=(last-first).toFixed(1);
    const arrow=last<first?'↓':last>first?'↑':'→';
    const color=last<first?'#16a34a':last>first?'#dc2626':'#64748b';
    if(rangeEl)rangeEl.innerHTML=`近30天 <span style="color:${color}">${arrow} ${Math.abs(diff)}kg</span>`;
  }else if(rangeEl){
    rangeEl.textContent='近30天';
  }
  if(points.length===0){
    container.innerHTML='<div class="flex items-center justify-center h-full text-xs text-slate-600">暂无记录，开始记录体重后会显示趋势图</div>';
    return;
  }
  let W=container.clientWidth;
  if(!W){
    setTimeout(()=>renderWeightChart(),120);
    return;
  }
  const H=160;
  const padL=32,padR=14,padT=14,padB=22;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const allValues=points.map(p=>p.value);
  let minV=Math.min(...allValues),maxV=Math.max(...allValues);
  if(minV===maxV){minV-=0.5;maxV+=0.5;}
  const padRng=(maxV-minV)*0.1;
  minV-=padRng;maxV+=padRng;
  const dayToX=(d)=>{
    const idx=days.indexOf(d);
    if(idx<0)return null;
    return padL+(idx/(days.length-1))*innerW;
  };
  const valToY=(v)=>padT+(1-(v-minV)/(maxV-minV))*innerH;
  let pathD='';
  points.forEach((p,i)=>{
    const x=dayToX(p.date),y=valToY(p.value);
    if(i===0)pathD+=`M${x} ${y}`;
    else pathD+=` L${x} ${y}`;
  });
  const areaPath=pathD+` L${dayToX(points[points.length-1].date)} ${padT+innerH} L${dayToX(points[0].date)} ${padT+innerH} Z`;
  let gridHtml='';
  const ySteps=4;
  for(let i=0;i<=ySteps;i++){
    const v=minV+(maxV-minV)*(i/ySteps);
    const y=valToY(v);
    gridHtml+=`<line x1="${padL}" y1="${y}" x2="${padL+innerW}" y2="${y}" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2 3"/>`;
    gridHtml+=`<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#94a3b8">${v.toFixed(1)}</text>`;
  }
  let xLabels='';
  const labelIdxs=[0,Math.floor(days.length/2),days.length-1];
  labelIdxs.forEach(i=>{
    const x=padL+(i/(days.length-1))*innerW;
    const dd=new Date(days[i]+'T00:00:00');
    xLabels+=`<text x="${x}" y="${padT+innerH+14}" text-anchor="middle" font-size="9" fill="#94a3b8">${dd.getMonth()+1}/${dd.getDate()}</text>`;
  });
  let dotsHtml='';
  points.forEach((p,i)=>{
    const x=dayToX(p.date),y=valToY(p.value);
    const isLast=i===points.length-1;
    dotsHtml+=`<circle cx="${x}" cy="${y}" r="${isLast?4:2.5}" fill="${isLast?'#16a34a':'#86efac'}" stroke="#fff" stroke-width="1.5"/>`;
    if(isLast){
      dotsHtml+=`<rect x="${x-22}" y="${y-22}" width="44" height="14" rx="3" fill="#16a34a"/>`;
      dotsHtml+=`<text x="${x}" y="${y-12}" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">${p.value}kg</text>`;
    }
  });
  container.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;">${gridHtml}<defs><linearGradient id="weightGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#86efac" stop-opacity="0.5"/><stop offset="100%" stop-color="#86efac" stop-opacity="0.05"/></linearGradient></defs><path d="${areaPath}" fill="url(#weightGrad)"/><path d="${pathD}" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dotsHtml}${xLabels}</svg>`;
}

// === 学习日历 ===
function selectStudyDate(ds){
  selStudyDate=ds;
  renderStudyCalendar();
}
function toggleStudyCalRead(){
  const reads=getReads();
  if(reads[selStudyDate]>0){
    delete reads[selStudyDate];
  }else{
    reads[selStudyDate]=30; // 默认标记30分钟
  }
  setReads(reads);
  renderStudyCalendar();
  renderStudy();
}
function toggleStudyCalDuo(){
  const d=getDuo();
  d[selStudyDate]=!d[selStudyDate];
  setDuo(d);
  renderStudyCalendar();
  renderStudy();
}
function renderStudyCalendar(){
  const d=new Date(vdStudyMonth+'T00:00:00');
  const y=d.getFullYear(),m=d.getMonth();
  $('#studyMonthDisplay').textContent=(m+1)+'月 '+y;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const reads=getReads(),duo=getDuo();
  let html='';
  for(let i=0;i<firstDay;i++)html+='<div class="cal-cell empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const hasRead=(reads[ds]||0)>0;
    const hasDuo=!!duo[ds];
    const isToday=ds===todayStr();
    const isSel=ds===selStudyDate;
    let cls='cal-cell';
    if(isToday)cls+=' cal-today';
    if(isSel)cls+=' selected';
    let bg='bg-slate-50';
    if(hasRead||hasDuo)bg='bg-amber-50';
    cls+=' '+bg;
    html+=`<div class="${cls}" onclick="selectStudyDate('${ds}')">`;
    html+=`<div class="cal-day-num">${day}</div>`;
    html+=`<div class="cal-marks">`;
    if(hasRead)html+=`<span class="cal-mark read"></span>`;
    if(hasDuo)html+=`<span class="cal-mark duo"></span>`;
    html+=`</div>`;
    html+='</div>';
  }
  $('#studyCalendar').innerHTML=html;
  // 更新底部
  const selDateObj=new Date(selStudyDate+'T00:00:00');
  const w=['日','一','二','三','四','五','六'];
  $('#studyCalSelDate').textContent=(selDateObj.getMonth()+1)+'月'+selDateObj.getDate()+'日 周'+w[selDateObj.getDay()];
  const hasRead=(reads[selStudyDate]||0)>0;
  const hasDuo=!!duo[selStudyDate];
  $('#studyCalReadBtn').textContent=hasRead?'📖 取消阅读标记':'📖 标记阅读';
  $('#studyCalReadBtn').className=hasRead?'px-3 py-2 rounded-lg bg-amber-100 text-amber-700 text-xs font-medium border border-amber-300 transition':'px-3 py-2 rounded-lg bg-amber-50 text-amber-600 text-xs font-medium border border-amber-100 hover:bg-amber-100 transition';
  $('#studyCalDuoBtn').textContent=hasDuo?'🦉 取消多邻国标记':'🦉 标记多邻国';
  $('#studyCalDuoBtn').className=hasDuo?'px-3 py-2 rounded-lg bg-pink-100 text-pink-700 text-xs font-medium border border-pink-300 transition':'px-3 py-2 rounded-lg bg-pink-50 text-pink-500 text-xs font-medium border border-pink-100 hover:bg-pink-100 transition';
  let info=[];
  if(hasRead)info.push('阅读 '+(reads[selStudyDate]||0)+'分钟');
  if(hasDuo)info.push('多邻国已完成');
  if(info.length===0)info.push('当日暂无记录');
  $('#studySelInfo').textContent=info.join('，');
}

function renderStudy(){
  $('#studyDateDisplay').textContent=fmtDate(vdStudy);
  const todayRead=getRead(vdStudy);
  $('#studyHistoryHint').textContent=vdStudy===todayStr()?'':(todayRead>0?'阅读 '+todayRead+' 分钟':'无阅读记录');
  switchBookTab(bookTab);
  const books=getBooks();
  let readingHtml='';
  const reading=books.filter(b=>b.status==='reading');
  if(reading.length===0)readingHtml='<p class="text-center text-sm text-slate-600 py-6">还没有在读的书，添加一本开始记录吧～</p>';
  else{
    reading.forEach(b=>{
      readingHtml+=`<div class="book-card"><div class="flex items-center justify-between"><div><div class="book-title">${escapeHtml(b.name)}</div><div class="book-min">已读 ${b.minutes||0} 分钟</div></div><div class="flex items-center gap-1"><div class="delete-btn-small" onclick="deleteBook(${b.id})">🗑</div></div></div>`;
      readingHtml+=`<div class="flex items-center gap-2 mt-2"><input type="number" id="bm_${b.id}" placeholder="+分钟" min="1" max="600" class="flex-1 px-2 py-1 rounded border border-amber-100 text-sm"><button class="px-3 py-1 rounded-lg bg-amber-100 text-amber-600 text-xs font-medium" onclick="recordBookMin(${b.id})">记录</button><button class="px-3 py-1 rounded-lg bg-green-100 text-green-600 text-xs font-medium" onclick="toggleBookStatus(${b.id})">读完</button></div>`;
    });
  }
  $('#bookReadingArea').innerHTML=readingHtml;
  let finishedHtml='';
  const finished=books.filter(b=>b.status==='finished');
  if(finished.length===0)finishedHtml='<p class="text-center text-sm text-slate-600 py-6">还没有读完的书，继续加油～</p>';
  else{
    finishedHtml+='<div class="flex items-center justify-between mb-2"><span class="text-xs font-medium text-slate-700">共 '+finished.length+' 本</span></div>';
    finished.forEach(b=>{finishedHtml+=`<div class="book-card book-done"><div class="flex items-center justify-between"><div><div class="book-title">${escapeHtml(b.name)}</div><div class="book-min">累计 ${b.minutes||0} 分钟</div></div><div class="flex items-center gap-2"><span class="text-xs text-green-600 font-medium">✓ 已读完</span><div class="delete-btn-small" onclick="deleteBook(${b.id})">🗑</div></div></div><button class="mt-2 w-full py-1 rounded-lg bg-green-50 text-green-600 text-xs font-medium border border-green-100" onclick="toggleBookStatus(${b.id})">标记为在读</button></div>`;});
  }
  $('#bookFinishedArea').innerHTML=finishedHtml;
  const duoDone=getDuoDay(vdStudy);
  $('#duoBtn').textContent=duoDone?'已完成 ✓':'标记完成';
  $('#duoBtn').className=duoDone?'w-full py-3 rounded-xl text-sm font-medium bg-green-100 text-green-600 transition':'w-full py-3 rounded-xl text-sm font-medium bg-pink-50 text-pink-400 hover:bg-pink-100 transition';
  $('#duoRecord').innerHTML=duoDone?`<div class="read-record" style="background:#fce7f3;border-color:#f9a8d4;"><span class="text-sm text-pink-600">🦉 多邻国已完成</span><div class="delete-btn-small" onclick="app.deleteDuoRecord('${vdStudy}')">🗑</div></div>`:'';
  let weekRead=0,weekDuo=0;
  for(let i=0;i<7;i++){const d=dateOffset(todayStr(),-i);weekRead+=getRead(d);if(getDuoDay(d))weekDuo++;}
  $('#weekStudyStat').textContent='本周阅读 '+weekRead+' 分钟，多邻国 '+weekDuo+' 天';
  renderStudyCalendar();
  if(studyMgmtOpen)renderStudyMgmt();
}
function recordBookMin(id){
  const input=$('#bm_'+id);
  const min=parseInt(input.value);
  if(!min||min<=0)return;
  addBookMinutes(id,min);
  const reads=getReads();
  reads[vdStudy]=(reads[vdStudy]||0)+min;
  setReads(reads);
  input.value='';
  renderAll();
}

function calcStreak(){
  let streak=0,d=todayStr();
  while(true){
    const checks=getChecks(d);const ex=getEx(d).filter(e=>e.done).length;const read=getRead(d);const duo=getDuoDay(d);
    const stickies=getStickies(d);
    const has=Object.values(checks).some(v=>v)||ex>0||read>0||duo||stickies.some(s=>s.done);
    if(!has)break;streak++;d=dateOffset(d,-1);if(streak>365)break;
  }
  return streak;
}
function calcCompletion(){
  const today=todayStr();
  const items=getCheckItems(),checks=getChecks(today);
  const checkDone=items.filter(i=>checks[i.key]).length;
  const exDone=getEx(today).filter(e=>e.done).length;
  const read=getRead(today);
  const duo=getDuoDay(today);
  let total=items.length+1+1;let done=checkDone+(exDone>0?1:0)+(read>0?1:0)+(duo?1:0);
  return Math.round(done/total*100);
}

let confettiAnim=null;
function confetti(){
  const canvas=$('#confettiCanvas');
  if(!canvas)return;
  canvas.style.display='block';
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const colors=['#fda4af','#fdba74','#fde047','#86efac','#7dd3fc','#c4b5fd','#f472b6','#fbbf24'];
  const shapes=['rect','circle','star'];
  const N=80;
  let particles=[];
  for(let i=0;i<N;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:-20-Math.random()*200,
      vx:(Math.random()-0.5)*6,
      vy:Math.random()*4+3,
      size:Math.random()*8+4,
      color:colors[Math.floor(Math.random()*colors.length)],
      shape:shapes[Math.floor(Math.random()*shapes.length)],
      rot:Math.random()*360,
      vr:(Math.random()-0.5)*15,
      life:1
    });
  }
  let frame=0;
  if(confettiAnim)cancelAnimationFrame(confettiAnim);
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    particles.forEach(p=>{
      if(p.y>canvas.height+40)return;
      alive=true;
      p.x+=p.vx;p.y+=p.vy;
      p.vy+=0.15;
      p.vx*=0.99;
      p.rot+=p.vr;
      if(p.y>canvas.height*0.7)p.life-=0.012;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      if(p.shape==='circle'){
        ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();
      }else if(p.shape==='rect'){
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      }else{
        ctx.beginPath();
        for(let s=0;s<5;s++){
          const a=(s*144-90)*Math.PI/180;
          const r=s%2===0?p.size/2:p.size/4;
          const px=Math.cos(a)*r,py=Math.sin(a)*r;
          if(s===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.fill();
      }
      ctx.restore();
    });
    if(alive && frame<400){
      confettiAnim=requestAnimationFrame(tick);
    }else{
      canvas.style.display='none';
      ctx.clearRect(0,0,canvas.width,canvas.height);
      confettiAnim=null;
    }
  }
  tick();
}

  navHistMonth:o=>{const d=new Date(vdHistMonth+'T00:00:00');d.setMonth(d.getMonth()+o);vdHistMonth=dateStr(d);renderMonthStat();},
  navHistMonthTo:s=>{vdHistMonth=s;renderMonthStat();},
  completeEx:(date,idx)=>{
    const ex=getEx(date),e=ex.find((x,i)=>i===idx&&!x.done);
    if(!e)return;const t=findExType(e.type);
    t.fields.forEach(f=>{e.detail[f.key]=f.type==='range'?parseInt($('#exf_'+idx+'_'+f.key).value):(parseInt($('#exf_'+idx+'_'+f.key).value)||0);});
    e.done=true;setEx(date,ex);renderAll();confetti();
  },
  cancelEx:(date,idx)=>{const ex=getEx(date);ex.splice(idx,1);setEx(date,ex);renderExercise();},
  deleteEx:(date,idx)=>{const ex=getEx(date);ex.splice(idx,1);setEx(date,ex);renderAll();},
  deleteDuoRecord:(date)=>{if(confirm('确认删除多邻国记录？')){const d=getDuo();delete d[date];setDuo(d);renderAll();}},
  deleteWeight:(date)=>deleteWeight(date),
  deleteDiaryItem:(id)=>{if(confirm('确认删除这条日记？')){deleteDiary(id);renderAll();}},
  deleteNotesItem:(id)=>{if(confirm('确认删除这条随笔？')){deleteNotes(id);renderAll();}}
};

bindAll();switchPanel('overview');renderAll();setInterval(()=>renderAll(),60000);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js?v=10').then(reg=>{
    // 检测到新SW立即激活
    if(reg.waiting){reg.waiting.postMessage('skipWaiting');}
    if(reg.installing){reg.installing.addEventListener('statechange',e=>{if(e.target.state==='installed'&&reg.waiting)reg.waiting.postMessage('skipWaiting');});}
  }).catch(()=>{});
  // 新SW接管后自动刷新页面
  navigator.serviceWorker.addEventListener('controllerchange',()=>{location.reload();});
  // 首次加载时清除旧缓存
  if(window.caches){caches.keys().then(ks=>ks.forEach(k=>{if(k!=='workbench-v8-force-refresh')caches.delete(k);}));}
}
</script>
