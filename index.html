<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的工作台</title>
<meta name="theme-color" content="#e0f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
.hidden{display:none !important;}
html,body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:#2d2d3a;
  background:#f4faf6;
}
/* 主面板 */
.main-panel{position:relative;z-index:1;min-height:100vh;padding-top:12px;padding-bottom:80px;max-width:600px;margin:0 auto;padding-left:16px;padding-right:16px;}
.panel-section{animation:fade .25s ease;padding-bottom:80px;min-height:100vh;display:none;}
.panel-section.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.card{position:relative;z-index:1;border-radius:22px;box-shadow:0 6px 24px rgba(22,101,52,.06);background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);}
.panel-header{position:relative;z-index:1;}

/* 底部Tab导航 */
.bottom-tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;gap:2px;padding:8px 6px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.05);box-shadow:0 -2px 12px rgba(0,0,0,.04);}
.bottom-tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px;border-radius:12px;cursor:pointer;font-size:10px;font-weight:500;color:#94a3b8;transition:all .2s;background:transparent;border:none;flex:1;min-width:0;}
.bottom-tab span:first-child{font-size:20px;transition:transform .2s;}
.bottom-tab.active{color:#16a34a;background:rgba(220,252,231,.6);}
.bottom-tab.active span:first-child{transform:scale(1.12);}
.bottom-tab:active{transform:scale(.95);}

/* 打卡圆圈 */
.check-circle{width:68px;height:68px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);border:2.5px solid #e2e8f0;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.7) 50%, rgba(241,245,249,.5) 100%);box-shadow:inset 2px 2px 6px rgba(255,255,255,.9),inset -3px -3px 8px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);position:relative;}
.check-circle:active{transform:scale(.92);}
.check-circle.done{transform:translateY(-4px) scale(1.05);box-shadow:0 8px 22px rgba(0,0,0,.18),inset 3px 3px 8px rgba(255,255,255,.35),inset -3px -3px 8px rgba(0,0,0,.1);border-color:transparent;}
.check-circle .check-emoji{font-size:24px;transition:transform .2s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.1));}
.check-circle.done .check-emoji{display:none;}
.check-circle .check-label{font-size:10px;margin-top:2px;font-weight:600;color:#334155;}
.check-circle.done .check-label{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:700;}
.check-circle:nth-child(6n+1){border-color:#fecdd3;}
.check-circle:nth-child(6n+1).done{background:radial-gradient(circle at 35% 30%, #fb7185 0%, #f43f5e 60%, #be123c 100%);}
.check-circle:nth-child(6n+2){border-color:#fed7aa;}
.check-circle:nth-child(6n+2).done{background:radial-gradient(circle at 35% 30%, #fdba74 0%, #fb923c 60%, #c2410c 100%);}
.check-circle:nth-child(6n+3){border-color:#fde68a;}
.check-circle:nth-child(6n+3).done{background:radial-gradient(circle at 35% 30%, #fde047 0%, #facc15 60%, #a16207 100%);}
.check-circle:nth-child(6n+4){border-color:#bbf7d0;}
.check-circle:nth-child(6n+4).done{background:radial-gradient(circle at 35% 30%, #86efac 0%, #4ade80 60%, #15803d 100%);}
.check-circle:nth-child(6n+5){border-color:#a5f3fc;}
.check-circle:nth-child(6n+5).done{background:radial-gradient(circle at 35% 30%, #7dd3fc 0%, #38bdf8 60%, #0369a1 100%);}
.check-circle:nth-child(6n+6){border-color:#ddd6fe;}
.check-circle:nth-child(6n+6).done{background:radial-gradient(circle at 35% 30%, #c4b5fd 0%, #a78bfa 60%, #5b21b6 100%);}
.check-wave{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;padding:8px 0;}
.check-wave > .check-circle:nth-child(odd){transform:translateY(-4px) rotate(-1deg);}
.check-wave > .check-circle:nth-child(even){transform:translateY(4px) rotate(1deg);}
.check-wave > .check-circle.done:nth-child(odd),.check-wave > .check-circle.done:nth-child(even){transform:translateY(-8px) scale(1.08) rotate(0deg);}

/* 便签 */
.sticky-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.sticky-note{position:relative;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px 12px 44px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:all .2s;animation:stickyIn .3s ease;}
@keyframes stickyIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.sticky-note:hover{transform:translateX(2px);box-shadow:0 4px 14px rgba(0,0,0,.08);}
.sticky-note.done{background:#f0fdf4;border-color:#bbf7d0;opacity:.7;}
.sticky-note.done .sticky-label{text-decoration:line-through;color:#86efac;}
.sticky-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%) rotate(-6deg);width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.sticky-label{font-size:14px;font-weight:600;color:#1e293b;line-height:1.4;}
.sticky-note.done .sticky-icon svg path{fill:#86efac;}
.sticky-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#ef4444;background:#fef2f2;font-size:12px;opacity:.6;transition:all .15s;}
.sticky-del:hover{opacity:1;background:#fecaca;}
.sticky-add{display:flex;gap:8px;margin-top:12px;}
.sticky-add input{flex:1;padding:10px 14px;border-radius:10px;border:1px dashed #fde68a;background:#fffdf5;font-size:14px;color:#1e293b;outline:none;transition:all .15s;}
.sticky-add input:focus{border-color:#fbbf24;border-style:solid;background:#fff;}
.sticky-add button{padding:10px 18px;border-radius:10px;background:#fef3c7;color:#92400e;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;}
.sticky-add button:hover{background:#fde68a;}

/* 运动chip */
.ex-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);border:2px solid transparent;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.ex-chip:hover{transform:translateY(-2px) rotate(-1deg);}
.ex-chip:active{transform:scale(.95);}
.ex-chip-off:nth-child(5n+1){border-color:#fecdd3;color:#e11d48;background:#fff1f2;}
.ex-chip-off:nth-child(5n+2){border-color:#fed7aa;color:#ea580c;background:#fff7ed;}
.ex-chip-off:nth-child(5n+3){border-color:#fde68a;color:#ca8a04;background:#fefce8;}
.ex-chip-off:nth-child(5n+4){border-color:#bbf7d0;color:#16a34a;background:#f0fdf4;}
.ex-chip-off:nth-child(5n+5){border-color:#a5f3fc;color:#0891b2;background:#ecfeff;}

.progress-track{background:#e8f0e8;border-radius:999px;}
input[type=range]{-webkit-appearance:none;height:6px;border-radius:6px;background:#fde68a;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fbbf24;box-shadow:0 2px 6px rgba(251,191,36,.3);cursor:pointer;border:3px solid #fff;}
.modal-bg{background:rgba(22,101,52,.12);backdrop-filter:blur(4px);}
textarea{resize:none;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#c4e8d0;border-radius:2px;}

.tag-success{background:#fef9c3;color:#854d0e;}
.tag-gratitude{background:#dcfce7;color:#166534;}
.tag-zhiji{background:#e9d5ff;color:#5b21b6;}

.diary-line{display:flex;align-items:baseline;border-bottom:1px solid #f1f5f9;min-height:42px;position:relative;}
.diary-num{flex-shrink:0;width:36px;padding:10px 6px 10px 14px;font-size:14px;color:#86efac;font-weight:600;}
.diary-tag{flex-shrink:0;padding:10px 4px;}
.diary-tag span{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;}
.diary-text{flex:1;padding:10px 14px 10px 6px;font-size:13px;color:#1e293b;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.diary-time{flex-shrink:0;padding:10px 14px 10px 4px;font-size:10px;color:#94a3b8;}

/* 剪切板按钮 */
.clipboard-btn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.04);transition:all .2s;color:#a78bfa;position:relative;}
.clipboard-btn:hover{background:#f5f3ff;color:#7c3aed;transform:scale(1.05);}
.clipboard-btn.pulse{animation:clipPulse .4s ease;}
@keyframes clipPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

.date-nav{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:1px solid #cbd5e1;background:#fff;color:#334155;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.date-nav:hover{background:#f0fdf4;color:#16a34a;}

.delete-btn{display:flex;opacity:.5;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:all .15s;position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#ef4444;background:#fef2f2;}
.delete-btn:hover{opacity:1;background:#fecaca;}
.delete-btn-small{width:20px;height:20px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:all .15s;color:#ef4444;background:#fef2f2;margin-left:4px;}
.delete-btn-small:hover{background:#fecaca;}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f1f5f9;transition:background .15s;position:relative;}
.item-row:last-child{border-bottom:none;}
.item-row:hover{background:#f8fafc;}
.notes-item{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid #f1f5f9;position:relative;transition:all .15s;}
.notes-item:hover{background:#f8fafc;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.notes-text{font-size:13px;color:#475569;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.notes-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:#94a3b8;}

.ex-record-card{border-radius:12px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;border:1px solid #bbf7d0;background:#f0fdf4;}
.ex-record-text{color:#166534;font-size:13px;}
.read-record{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fffbeb;border-radius:10px;margin-bottom:6px;border:1px solid #fde68a;}

.setting-btn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;border:1px solid #e2e8f0;background:#fff;color:#94a3b8;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.setting-btn:hover{background:#f0fdf4;color:#16a34a;}
.setting-btn.open{transform:rotate(90deg);background:#dcfce7;color:#16a34a;border-color:#bbf7d0;}
.mgmt-panel{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease;opacity:0;}
.mgmt-panel.open{max-height:600px;opacity:1;margin-top:16px;}

.book-tab{display:inline-flex;align-items:center;gap:4px;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid #e2e8f0;background:#fff;color:#64748b;}
.book-tab.active{background:#fffbeb;color:#ca8a04;border-color:#fde68a;}
.book-card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid #f1f5f9;}
.book-title{font-size:14px;font-weight:600;color:#334155;}
.book-min{font-size:12px;color:#94a3b8;}
.book-done{background:#f0fdf4;border-color:#bbf7d0;}

/* 日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-bottom:4px;}
.cal-head div{font-size:10px;color:#94a3b8;padding:2px 0;}
.cal-cell{min-height:40px;border-radius:8px;text-align:center;padding:2px 1px;cursor:pointer;transition:all .15s;position:relative;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
.cal-cell.empty{cursor:default;}
.cal-cell.cal-today{box-shadow:0 0 0 2px #86efac;}
.cal-cell:not(.empty):hover{transform:scale(1.08);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.cal-day-num{font-size:10px;color:#94a3b8;line-height:1;}
.cal-marks{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;margin-top:1px;}
.cal-mark{width:6px;height:6px;border-radius:50%;}
.cal-mark.read{background:#fbbf24;}
.cal-mark.duo{background:#f472b6;}
.cal-weight-val{font-size:9px;font-weight:700;color:#16a34a;line-height:1.1;}
.cal-cell.selected{background:#fffbeb !important;border-color:#fbbf24 !important;box-shadow:0 0 0 2px #fbbf24;}

/* 日记剪切板弹窗 */
.clip-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.2);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;}
.clip-modal.open{display:flex;}
.clip-modal .card{width:100%;max-width:420px;}
.clip-modal textarea{width:100%;min-height:140px;padding:12px;border-radius:12px;border:1px solid #ddd6fe;font-size:14px;outline:none;background:#fff;color:#1e293b;}
.clip-modal textarea:focus{border-color:#a78bfa;}
.clip-modal .preview{font-size:12px;color:#64748b;margin-top:6px;line-height:1.5;}

/* 响应式 */
@media(min-width:640px){
  .main-panel{padding-left:24px;padding-right:24px;}
}
</style>
</head>
<body>

<!-- 主面板 -->
<main class="main-panel" id="mainContent">

  <!-- 总览 -->
  <div id="panel-overview" class="panel-section active">
    <div class="panel-header" style="margin-top:8px;">
      <h2 class="text-xl font-bold text-amber-600 mb-1">今日总览</h2>
      <p id="todayDateMain" class="text-sm text-slate-600 mb-4"></p>
    </div>
    <div class="card p-4 mb-4" style="border-top:4px solid #fbbf24;">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-slate-700">完成度</span>
        <div class="flex items-center gap-2">
          <span class="text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-500">🔥 <span id="streakDays">0</span>天</span>
          <span class="text-2xl font-bold text-amber-500" id="completionPctMain">0%</span>
        </div>
      </div>
      <div class="progress-track h-3 rounded-full overflow-hidden"><div id="completionBarMain" class="h-full rounded-full transition-all duration-500" style="width:0%;background:linear-gradient(90deg,#93c5fd,#86efac,#fde68a,#fdba74,#fbcfe8)"></div></div>
      <div id="miniSummary" class="flex flex-wrap gap-2 mt-3 text-xs"></div>
    </div>
    <div class="card p-4 mb-4" style="border-top:4px solid #fda4af;">
      <h3 class="text-sm font-semibold text-slate-600 mb-3">快速待办</h3>
      <div id="quickCheckGrid" class="check-wave"></div>
    </div>
    <div class="card p-4" style="border-top:4px solid #93c5fd;">
      <h3 class="text-sm font-semibold text-slate-600 mb-2">今日状态</h3>
      <div id="overviewStatus" class="space-y-1.5 text-sm"></div>
    </div>
  </div>

  <!-- 每日待办 -->
  <div id="panel-checkin" class="panel-section">
    <div class="panel-header flex items-center justify-between mb-4" style="margin-top:8px;">
      <h2 class="text-xl font-bold" style="color:#e11d48;">每日待办</h2>
      <button class="setting-btn" id="checkSettingBtn" onclick="toggleCheckMgmt()">⚙️</button>
    </div>
    <div class="flex items-center gap-3 mb-4">
      <button class="date-nav" onclick="app.navCheck(-1)">←</button>
      <span id="checkinDateDisplay" class="text-sm font-semibold" style="color:#e11d48;"></span>
      <button class="date-nav" onclick="app.navCheck(1)">→</button>
      <button class="px-2 py-1 rounded-lg text-xs bg-rose-50 text-rose-400 border border-rose-100 font-medium" onclick="app.navCheckTo(todayStr())">今天</button>
    </div>
    <div id="checkinHistoryHint" class="mb-2 text-xs text-slate-600"></div>
    <div id="checkProgress" class="text-sm text-slate-600 mb-3"></div>
    <div id="checkGrid" class="check-wave"></div>
    <div class="mt-4">
      <div class="flex items-center gap-2 mb-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h12l4 4v12H4z" fill="#fde68a" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 4v4h4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span class="text-sm font-semibold text-amber-600">便签清单</span>
      </div>
      <div id="stickyList" class="sticky-list"></div>
      <div class="sticky-add">
        <input id="newStickyInput" type="text" placeholder="新增一条待办事项..." onkeydown="if(event.key==='Enter')addSticky()">
        <button onclick="addSticky()">添加</button>
      </div>
    </div>
    <div id="checkinRecords" class="mgmt-panel"></div>
  </div>

  <!-- 运动计划 -->
  <div id="panel-exercise" class="panel-section">
    <div class="panel-header flex items-center justify-between mb-4" style="margin-top:8px;">
      <h2 class="text-xl font-bold" style="color:#16a34a;">今日运动</h2>
      <button class="setting-btn" id="exSettingBtn" onclick="toggleExMgmt()">⚙️</button>
    </div>
    <div class="flex items-center gap-3 mb-4">
      <button class="date-nav" onclick="app.navEx(-1)">←</button>
      <span id="exDateDisplay" class="text-sm font-semibold" style="color:#16a34a;"></span>
      <button class="date-nav" onclick="app.navEx(1)">→</button>
      <button class="px-2 py-1 rounded-lg text-xs bg-green-50 text-green-500 border border-green-100 font-medium" onclick="app.navExTo(todayStr())">今天</button>
    </div>
    <div id="exHistoryHint" class="mb-2 text-xs text-slate-600"></div>
    <p class="text-xs text-slate-600 mb-3">可多选，一天可做多项运动</p>
    <div id="exTagList" class="flex flex-wrap gap-2 mb-4"></div>
    <div id="exDetailArea" class="space-y-3"></div>
    <div id="exRecordsArea" class="mt-3 space-y-2"></div>
    <div id="exMgmtArea" class="mgmt-panel"></div>
    <div id="weekExerciseStat" class="mt-4 text-sm font-medium" style="color:#16a34a;"></div>
    <!-- 体重月历 -->
    <div class="card mt-4" style="border-top:4px solid #86efac;overflow:hidden;">
      <div style="background:repeating-linear-gradient(90deg,#bbf7d0 0,#bbf7d0 8px,#a7f3d0 8px,#a7f3d0 10px);height:6px;margin:-1px -1px 0 -1px;border-radius:12px 12px 0 0;opacity:.7;"></div>
      <div class="p-4">
        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div class="flex items-center gap-2">
            <h3 class="text-sm font-semibold text-green-600">体重月历</h3>
            <span class="text-[10px] text-slate-600">点击日期记录</span>
          </div>
          <div class="flex items-center gap-2">
            <button class="date-nav" onclick="app.navWeightMonth(-1)">←</button>
            <span id="weightMonthDisplay" class="text-sm font-semibold text-green-600"></span>
            <button class="date-nav" onclick="app.navWeightMonth(1)">→</button>
            <button class="px-2 py-1 rounded-lg text-xs bg-green-50 text-green-500 border border-green-100 font-medium" onclick="app.navWeightMonthTo(todayStr())">本月</button>
          </div>
        </div>
        <div class="cal-head"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
        <div id="weightCalendar" class="cal-grid"></div>

<script>
// ==================== 工具函数 ====================
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const dateStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dateOffset=(base,off)=>{const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+off);return dateStr(d);}
const fmtDate=s=>{const d=new Date(s+'T00:00:00'),w=['日','一','二','三','四','五','六'];return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w[d.getDay()];}
const fmtTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
const load=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const escapeHtml=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const getWeekRange=base=>{
  const d=new Date(base+'T00:00:00'),day=d.getDay()||7;
  const mon=new Date(d);mon.setDate(d.getDate()-day+1);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return [dateStr(mon),dateStr(sun)];
};

// ==================== 常量 ====================
const DIARY_TYPES={
  success:{label:'成功日记',emoji:'🎉',cls:'tag-success'},
  gratitude:{label:'感恩日记',emoji:'🙏',cls:'tag-gratitude'},
  zhiji:{label:'忽而知己',emoji:'💡',cls:'tag-zhiji'}
};
const DEFAULT_EX_TYPES=[
  {key:'climb',label:'爬坡',emoji:'🧗',fields:[{key:'duration',label:'时长',unit:'min',type:'number',min:0,max:300,step:5,default:30},{key:'incline',label:'坡度',unit:'%',type:'number',min:0,max:20,step:1,default:10}]},
  {key:'swim',label:'游泳',emoji:'🏊',fields:[{key:'distance',label:'距离',unit:'m',type:'number',min:0,max:5000,step:50,default:1000},{key:'duration',label:'时长',unit:'min',type:'number',min:0,max:300,step:5,default:40}]},
  {key:'back',label:'练背',emoji:'💪',fields:[{key:'duration',label:'时长',unit:'min',type:'number',min:0,max:300,step:5,default:45},{key:'sets',label:'组数',unit:'组',type:'number',min:0,max:30,step:1,default:5}]}
];

// 解析剪贴板文本，返回 [{type, content}, ...]（只解析，不保存）
function parseDiaryText(text){
  const typeMap={
    '🎉':'success','成功日记':'success','成功':'success',
    '🙏':'gratitude','感恩日记':'gratitude','感恩':'gratitude',
    '💡':'zhiji','忽而知己':'zhiji','知己':'zhiji'
  };
  const lines=text.split('\n');
  const segments=[];
  let currentType=null;
  let currentLines=[];

  const flush=()=>{
    if(currentLines.length===0)return;
    const content=currentLines.join('\n').trim();
    if(content){
      segments.push({type:currentType||'gratitude',content});
    }
  };

  for(const line of lines){
    const trimmed=line.trim();
    let foundType=null;
    for(const [marker,type] of Object.entries(typeMap)){
      if(trimmed.includes(marker)){
        foundType=type;
        break;
      }
    }
    if(foundType){
      // 切到新段落前，先保存上一段
      flush();
      currentType=foundType;
      currentLines=[];
    }else if(currentType||segments.length>0){
      // 有明确标记的段落：收集
      // 没有标记但已经有段落：当作上一段的延续
      currentLines.push(line);
    }else{
      // 第一段就无标记：作为默认段落（兜底）
      currentLines.push(line);
    }
  }
  flush();
  return segments;
}

function previewClipboard(){
  const text=$('#clipTextarea').value.trim();
  const preview=$('#clipPreview');
  if(!text){preview.textContent='';return;}
  const segments=parseDiaryText(text);
  if(segments.length===0){preview.textContent='⚠️ 未识别到内容';return;}
  const tagMap={success:'🎉 成功',gratitude:'🙏 感恩',zhiji:'💡 知己'};
  const lines=segments.map(s=>`${tagMap[s.type]}: ${s.content.slice(0,30)}${s.content.length>30?'…':''}`);
  preview.innerHTML=`将分发 <b>${segments.length}</b> 条到 <b>${vdDiary}</b>：<br>`+lines.join('<br>');
}

function processClipboard(){
  const text=$('#clipTextarea').value.trim();
  if(!text)return;
  const segments=parseDiaryText(text);
  if(segments.length===0){
    $('#clipPreview').textContent='⚠️ 未识别到内容';
    return;
  }
  const diaries=getDiaries();
  const now=fmtTime();
  segments.forEach(seg=>{
    diaries.unshift({id:Date.now()+Math.random(),date:vdDiary,type:seg.type,content:seg.content,time:now});
  });
  setDiaries(diaries);
  $('#clipPreview').textContent='✅ 已自动分发 '+segments.length+' 条日记到 '+vdDiary;
  $('#clipBtn').classList.add('pulse');
  setTimeout(()=>$('#clipBtn').classList.remove('pulse'),400);
  closeClipModal();
  renderDiaryList();
  renderOverviewStatus();
  confetti();
}

function selectWeightDate(ds){selWeightDate=ds;renderWeightCalendar();}
function renderWeightCalendar(){
  const d=new Date(vdWeightMonth+'T00:00:00'),y=d.getFullYear(),m=d.getMonth();
  $('#weightMonthDisplay').textContent=(m+1)+'月 '+y;
  const firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate();
  const weights=getWeights();
  let html='';
  for(let i=0;i<firstDay;i++)html+='<div class="cal-cell empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),w=weights[ds];
    const isToday=ds===todayStr(),isSel=ds===selWeightDate;
    let cls='cal-cell';if(isToday)cls+=' cal-today';if(isSel)cls+=' selected';
    cls+=w?' bg-green-50':' bg-slate-50';
    html+=`<div class="${cls}" onclick="selectWeightDate('${ds}')" style="min-height:42px;">`;
    html+=`<div class="cal-day-num">${day}</div>`;
    if(w){
      html+=`<div class="cal-weight-val">${w}</div>`;
      html+=`<div class="text-red-300 text-[8px] cursor-pointer mt-0.5" onclick="event.stopPropagation();deleteWeight('${ds}')">✕</div>`;
    }
    html+='</div>';
  }
  $('#weightCalendar').innerHTML=html;
  const selW=weights[selWeightDate];
  const selDObj=new Date(selWeightDate+'T00:00:00'),w=['日','一','二','三','四','五','六'];
  $('#weightCalSelDate').textContent=(selDObj.getMonth()+1)+'月'+selDObj.getDate()+'日 周'+w[selDObj.getDay()];
  if(selW){$('#weightInput').value=selW;$('#weightSelInfo').textContent='当日已记录：'+selW+' kg';}
  else{$('#weightInput').value='';$('#weightSelInfo').textContent='当日暂无记录';}
  renderWeightChart();
}

function renderWeightChart(){
  const container=$('#weightChart'),rangeEl=$('#weightRangeDisplay');
  if(!container)return;
  const weights=getWeights();
  const days=[];for(let i=29;i>=0;i--)days.push(dateOffset(todayStr(),-i));
  const points=days.map(d=>({date:d,value:weights[d]})).filter(p=>p.value!=null);
  if(points.length>=2){
    const first=points[0].value,last=points[points.length-1].value;
    const diff=(last-first).toFixed(1);
    const arrow=last<first?'↓':last>first?'↑':'→';
    const color=last<first?'#16a34a':last>first?'#dc2626':'#64748b';
    if(rangeEl)rangeEl.innerHTML=`近30天 <span style="color:${color}">${arrow} ${Math.abs(diff)}kg</span>`;
  }else if(rangeEl){rangeEl.textContent='近30天';}
  if(points.length===0){container.innerHTML='<div class="flex items-center justify-center h-full text-xs text-slate-600">暂无记录</div>';return;}
  let W=container.clientWidth;
  if(!W){setTimeout(renderWeightChart,120);return;}
  const H=160,padL=32,padR=14,padT=14,padB=22;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const allVals=points.map(p=>p.value);
  let minV=Math.min(...allVals),maxV=Math.max(...allVals);
  if(minV===maxV){minV-=0.5;maxV+=0.5;}
  const padRng=(maxV-minV)*0.1;minV-=padRng;maxV+=padRng;
  const dayToX=d=>{const idx=days.indexOf(d);return idx<0?null:padL+(idx/(days.length-1))*innerW;};
  const valToY=v=>padT+(1-(v-minV)/(maxV-minV))*innerH;
  let pathD='';points.forEach((p,i)=>{const x=dayToX(p.date),y=valToY(p.value);pathD+=i===0?`M${x} ${y}`:` L${x} ${y}`;});
  const areaPath=pathD+` L${dayToX(points[points.length-1].date)} ${padT+innerH} L${dayToX(points[0].date)} ${padT+innerH} Z`;
  let gridHtml='';
  for(let i=0;i<=4;i++){const v=minV+(maxV-minV)*(i/4),y=valToY(v);gridHtml+=`<line x1="${padL}" y1="${y}" x2="${padL+innerW}" y2="${y}" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2 3"/><text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#94a3b8">${v.toFixed(1)}</text>`;}
  let xLabels='';[0,Math.floor(days.length/2),days.length-1].forEach(i=>{const x=padL+(i/(days.length-1))*innerW,dd=new Date(days[i]+'T00:00:00');xLabels+=`<text x="${x}" y="${padT+innerH+14}" text-anchor="middle" font-size="9" fill="#94a3b8">${dd.getMonth()+1}/${dd.getDate()}</text>`;});
  let dotsHtml='';points.forEach((p,i)=>{const x=dayToX(p.date),y=valToY(p.value),isLast=i===points.length-1;dotsHtml+=`<circle cx="${x}" cy="${y}" r="${isLast?4:2.5}" fill="${isLast?'#16a34a':'#86efac'}" stroke="#fff" stroke-width="1.5"/>`;if(isLast){dotsHtml+=`<rect x="${x-22}" y="${y-22}" width="44" height="14" rx="3" fill="#16a34a"/><text x="${x}" y="${y-12}" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">${p.value}kg</text>`;}});
  container.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;">${gridHtml}<defs><linearGradient id="weightGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#86efac" stop-opacity="0.5"/><stop offset="100%" stop-color="#86efac" stop-opacity="0.05"/></linearGradient></defs><path d="${areaPath}" fill="url(#weightGrad)"/><path d="${pathD}" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dotsHtml}${xLabels}</svg>`;
}

function renderStudyCalendar(){
  const d=new Date(vdStudyMonth+'T00:00:00'),y=d.getFullYear(),m=d.getMonth();
  $('#studyMonthDisplay').textContent=(m+1)+'月 '+y;
  const firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate();
  const reads=getReads(),duo=getDuo();
  let html='';
  for(let i=0;i<firstDay;i++)html+='<div class="cal-cell empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const hasRead=(reads[ds]||0)>0,hasDuo=!!duo[ds];
    const isToday=ds===todayStr(),isSel=ds===selStudyDate;
    let cls='cal-cell';if(isToday)cls+=' cal-today';if(isSel)cls+=' selected';
    cls+=(hasRead||hasDuo)?' bg-amber-50':' bg-slate-50';
    html+=`<div class="${cls}" onclick="selectStudyDate('${ds}')">`;
    html+=`<div class="cal-day-num">${day}</div><div class="cal-marks">`;
    if(hasRead)html+=`<span class="cal-mark read"></span>`;
    if(hasDuo)html+=`<span class="cal-mark duo"></span>`;
    html+=`</div></div>`;
  }
  $('#studyCalendar').innerHTML=html;
  const selDObj=new Date(selStudyDate+'T00:00:00'),w=['日','一','二','三','四','五','六'];
  $('#studyCalSelDate').textContent=(selDObj.getMonth()+1)+'月'+selDObj.getDate()+'日 周'+w[selDObj.getDay()];
  const hasRead=(reads[selStudyDate]||0)>0,hasDuo=!!duo[selStudyDate];
  $('#studyCalReadBtn').textContent=hasRead?'📖 取消阅读标记':'📖 标记阅读';
  $('#studyCalReadBtn').className='px-3 py-2 rounded-lg '+(hasRead?'bg-amber-100 text-amber-700 border border-amber-300':'bg-amber-50 text-amber-600 border border-amber-100 hover:bg-amber-100')+' text-xs font-medium transition';
  $('#studyCalDuoBtn').textContent=hasDuo?'🦉 取消多邻国标记':'🦉 标记多邻国';
  $('#studyCalDuoBtn').className='px-3 py-2 rounded-lg '+(hasDuo?'bg-pink-100 text-pink-700 border border-pink-300':'bg-pink-50 text-pink-500 border border-pink-100 hover:bg-pink-100')+' text-xs font-medium transition';
  let info=[];if(hasRead)info.push('阅读 '+(reads[selStudyDate]||0)+'分钟');if(hasDuo)info.push('多邻国已完成');if(info.length===0)info.push('当日暂无记录');
  $('#studySelInfo').textContent=info.join('，');

function renderStudy(){
  $('#studyDateDisplay').textContent=fmtDate(vdStudy);

  else reading.forEach(b=>{
    readingHtml+=`<div class="book-card"><div class="flex items-center justify-between"><div><div class="book-title">${escapeHtml(b.name)}</div><div class="book-min">已读 ${b.minutes||0} 分钟</div></div><div class="delete-btn-small" onclick="deleteBook(${b.id})">🗑</div></div><div class="flex items-center gap-2 mt-2"><input type="number" id="bm_${b.id}" placeholder="+分钟" min="1" max="600" class="flex-1 px-2 py-1 rounded border border-amber-100 text-sm"><button class="px-3 py-1 rounded-lg bg-amber-100 text-amber-600 text-xs font-medium" onclick="recordBookMin(${b.id})">记录</button><button class="px-3 py-1 rounded-lg bg-green-100 text-green-600 text-xs font-medium" onclick="toggleBookStatus(${b.id})">读完</button></div>`;
  });

  else{
    finishedHtml+='<div class="flex items-center justify-between mb-2"><span class="text-xs font-medium text-slate-700">共 '+finished.length+' 本</span></div>';
    finished.forEach(b=>finishedHtml+=`<div class="book-card book-done"><div class="flex items-center justify-between"><div><div class="book-title">${escapeHtml(b.name)}</div><div class="book-min">累计 ${b.minutes||0} 分钟</div></div><div class="flex items-center gap-2"><span class="text-xs text-green-600 font-medium">✓ 已读完</span><div class="delete-btn-small" onclick="deleteBook(${b.id})">🗑</div></div></div><button class="mt-2 w-full py-1 rounded-lg bg-green-50 text-green-600 text-xs font-medium border border-green-100" onclick="toggleBookStatus(${b.id})">标记为在读</button></div>`);
  }
  $('#bookFinishedArea').innerHTML=finishedHtml;
  const duoDone=getDuoDay(vdStudy);
  $('#duoBtn').textContent=duoDone?'已完成 ✓':'标记完成';
  $('#duoBtn').className=duoDone?'w-full py-3 rounded-xl text-sm font-medium bg-green-100 text-green-600 transition':'w-full py-3 rounded-xl text-sm font-medium bg-pink-50 text-pink-400 hover:bg-pink-100 transition';
  $('#duoRecord').innerHTML=duoDone?`<div class="read-record" style="background:#fce7f3;border-color:#f9a8d4;"><span class="text-sm text-pink-600">🦉 多邻国已完成</span><div class="delete-btn-small" onclick="app.deleteDuoRecord('${vdStudy}')">🗑</div></div>`:'';
  let weekRead=0,weekDuo=0;
  for(let i=0;i<7;i++){const d=dateOffset(todayStr(),-i);weekRead+=getRead(d);if(getDuoDay(d))weekDuo++;}
  $('#weekStudyStat').textContent='本周阅读 '+weekRead+' 分钟，多邻国 '+weekDuo+' 天';
  renderStudyCalendar();

function recordBookMin(id){

function renderHistory(){
  $('#histDateDisplay').textContent=fmtDate(vdHist);

  const read=getRead(vdHist),duo=getDuoDay(vdHist);
  const diaries=getDiaries().filter(d=>d.date===vdHist),notes=getNotes().filter(n=>n.date===vdHist);
  let html='';

  const items=getCheckItems();
  if(Object.keys(checks).length===0)html+='<p class="text-xs text-slate-600">无记录</p>';
  else items.forEach(item=>{if(checks[item.key]!==undefined)html+=`<div class="flex items-center gap-2 text-sm py-1"><span>${checks[item.key]?'✓':'○'}</span><span>${item.emoji} ${item.label}</span></div>`;});
  html+='</div>';
  html+='<div class="card p-4" style="border-top:4px solid #86efac;"><h3 class="text-sm font-semibold text-green-600 mb-3">🏃 运动</h3>';
  if(ex.length===0)html+='<p class="text-xs text-slate-600">无记录</p>';
  else ex.forEach(e=>{if(!e.done)return;const t=findExType(e.type);let txt=t.emoji+' '+t.label;if(t.fields.length>0)txt+='：'+t.fields.map(f=>e.detail[f.key]+f.unit).join(' / ');html+=`<div class="text-sm text-green-700 py-1">${txt}</div>`;});
  html+='</div>';
  html+='<div class="card p-4" style="border-top:4px solid #fbbf24;"><h3 class="text-sm font-semibold text-amber-500 mb-3">📖 学习</h3>';
  if(read>0)html+=`<div class="text-sm text-amber-700 py-1">📖 阅读 ${read} 分钟</div>`;
  if(duo)html+=`<div class="text-sm text-pink-600 py-1">🦉 多邻国已完成</div>`;

// 【修复】周统计和月统计中，阅读时长直接从readRecords逐日累加，不再重复计算书籍的minutes
function renderWeekStat(){
  const [mon,sun]=getWeekRange(vdHistWeek);
  const days=[];for(let i=0;i<7;i++)days.push(dateOffset(mon,i));
  const m=new Date(mon+'T00:00:00'),s=new Date(sun+'T00:00:00'),w=['日','一','二','三','四','五','六'];
  $('#histWeekDisplay').textContent=(m.getMonth()+1)+'/'+m.getDate()+'(周'+w[m.getDay()]+') ~ '+(s.getMonth()+1)+'/'+s.getDate()+'(周'+w[s.getDay()]+')';
  const checkItems=getCheckItems(),exTypes=getExTypes();
  // 直接读取原始数据，确保统计一致性
  const checkRecords=load('checkRecords',{}),exRecords=load('exRecords',{}),readRecords=load('readRecords',{}),duoRecords=load('duoRecords',{});
  const checkCount={};checkItems.forEach(i=>checkCount[i.key]=0);
  const exCount={};exTypes.forEach(i=>exCount[i.key]=0);
  let totalRead=0,totalDuo=0;
  days.forEach(d=>{
    const cr=checkRecords[d]||{};checkItems.forEach(i=>{if(cr[i.key])checkCount[i.key]++;});
    (exRecords[d]||[]).filter(e=>e.done).forEach(e=>{if(exCount[e.type]!==undefined)exCount[e.type]++;});
    totalRead+=readRecords[d]||0;
    if(duoRecords[d])totalDuo++;
  });
  let html='<div class="card p-4" style="border-top:4px solid #c4b5fd;"><div class="flex items-center justify-between mb-3"><h3 class="text-sm font-semibold text-violet-500">📊 本周统计</h3></div>';
  html+='<div class="mb-3"><p class="text-xs font-medium text-rose-500 mb-2">每日待办</p>';
  checkItems.forEach(i=>{const c=checkCount[i.key]||0;html+=`<div class="mb-2"><div class="flex justify-between items-center text-xs mb-1"><span>${i.emoji} ${i.label}</span><span class="font-medium ${c>=7?'text-green-500':c>0?'text-violet-500':'text-slate-500'}">${c}/7 次</span></div><div class="progress-track h-1.5 rounded-full overflow-hidden"><div class="h-full rounded-full ${c>=7?'bg-green-400':'bg-violet-400'}" style="width:${Math.round(c/7*100)}%"></div></div></div>`;});
  html+='</div>';
  html+='<div class="mb-3"><p class="text-xs font-medium text-green-600 mb-2">运动</p>';
  exTypes.forEach(i=>{const c=exCount[i.key]||0;html+=`<div class="mb-2"><div class="flex justify-between items-center text-xs mb-1"><span>${i.emoji} ${i.label}</span><span class="font-medium ${c>0?'text-green-500':'text-slate-500'}">${c} 次</span></div><div class="progress-track h-1.5 rounded-full overflow-hidden"><div class="h-full rounded-full bg-green-400" style="width:${Math.round(c/7*100)}%"></div></div></div>`;});
  html+='</div>';
  html+='<div><p class="text-xs font-medium text-amber-500 mb-2">学习</p>';
  html+=`<div class="flex justify-between items-center text-xs py-1"><span>📖 阅读</span><span class="font-medium text-amber-600">${totalRead} 分钟</span></div>`;
  html+=`<div class="flex justify-between items-center text-xs py-1"><span>🦉 多邻国</span><span class="font-medium text-pink-500">${totalDuo}/7 天</span></div>`;

  html+='</div></div>';

// ==================== 总览 ====================
function calcStreak(){
  let streak=0,d=todayStr();
  while(true){
    const checks=getChecks(d),ex=getEx(d).filter(e=>e.done).length;
    const read=getRead(d),duo=getDuoDay(d);
    const stickies=getStickies(d);
    const has=Object.values(checks).some(v=>v)||ex>0||read>0||duo||stickies.some(s=>s.done);
    if(!has)break;streak++;d=dateOffset(d,-1);if(streak>365)break;
  }
  return streak;
}
function calcCompletion(){
  const today=todayStr();
  const items=getCheckItems(),checks=getChecks(today);
  const checkDone=items.filter(i=>checks[i.key]).length;
  const exDone=getEx(today).filter(e=>e.done).length;
  const read=getRead(today),duo=getDuoDay(today);
  let total=items.length+1+1,done=checkDone+(exDone>0?1:0)+(read>0?1:0)+(duo?1:0);
  return Math.round(done/total*100);
}
function renderHeader(){
  const d=new Date(),w=['日','一','二','三','四','五','六'];
  $('#todayDateMain').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+w[d.getDay()];
  const pct=calcCompletion(),streak=calcStreak();
  $('#streakDays').textContent=streak;
  $('#completionPctMain').textContent=pct+'%';
  $('#completionBarMain').style.width=pct+'%';
  const items=getCheckItems(),checks=getChecks(todayStr());
  const checkDone=items.filter(i=>checks[i.key]).length;
  const exDone=getEx(todayStr()).filter(e=>e.done).length;
  const todayRead=getRead(todayStr());
  let ms=[];
  ms.push(`<span class="px-2 py-1 rounded-full ${checkDone===items.length&&items.length>0?'bg-green-100 text-green-600':'bg-rose-50 text-rose-400'}">✅ ${checkDone}/${items.length}</span>`);
  ms.push(`<span class="px-2 py-1 rounded-full ${exDone>0?'bg-green-100 text-green-600':'bg-green-50 text-green-300'}">🏃 ${exDone>0?exDone+'项':'未做'}</span>`);
  ms.push(`<span class="px-2 py-1 rounded-full ${todayRead>0?'bg-amber-100 text-amber-600':'bg-amber-50 text-amber-300'}">📖 ${todayRead}min</span>`);
  ms.push(`<span class="px-2 py-1 rounded-full ${getDuoDay(todayStr())?'bg-pink-100 text-pink-500':'bg-pink-50 text-pink-300'}">🦉 ${getDuoDay(todayStr())?'✓':'○'}</span>`);
  $('#miniSummary').innerHTML=ms.join('');
}
function renderQuickCheck(){
  const items=getCheckItems(),checks=getChecks(todayStr());
  let grid='';
  items.forEach(item=>{
    const done=checks[item.key];
    grid+=`<div class="check-circle ${done?'done':''}" onclick="toggleCheck('${todayStr()}','${item.key}')"><div class="check-emoji">${item.emoji}</div><div class="check-label ${done?'text-white':'text-slate-600'}">${item.label}</div></div>`;
  });
  $('#quickCheckGrid').innerHTML=grid;
}
function renderOverviewStatus(){
  const today=todayStr();
  const items=getCheckItems(),checks=getChecks(today);
  const ex=getEx(today).filter(e=>e.done);
  const read=getRead(today),duo=getDuoDay(today);
  let sl=[];
  const checkDone=items.filter(i=>checks[i.key]).length;
  if(checkDone===items.length&&items.length>0)sl.push('<div class="flex items-center gap-1.5 text-green-600"><span>✓</span> 待办全部完成</div>');
  else if(checkDone>0)sl.push('<div class="flex items-center gap-1.5 text-rose-400"><span>◐</span> 待办 '+checkDone+'/'+items.length+'</div>');
  else sl.push('<div class="flex items-center gap-1.5 text-slate-600"><span>○</span> 待办未开始</div>');
  if(ex.length>0)sl.push('<div class="flex items-center gap-1.5 text-green-600"><span>✓</span> 运动：'+ex.map(e=>{const t=findExType(e.type);return t.emoji+t.label;}).join(' ')+'</div>');
  else sl.push('<div class="flex items-center gap-1.5 text-green-300"><span>○</span> 运动未开始</div>');
  if(read>0)sl.push('<div class="flex items-center gap-1.5 text-amber-600"><span>✓</span> 阅读'+read+'分钟</div>');
  else sl.push('<div class="flex items-center gap-1.5 text-amber-300"><span>○</span> 阅读未开始</div>');
  if(duo)sl.push('<div class="flex items-center gap-1.5 text-pink-500"><span>✓</span> 多邻国完成</div>');
  else sl.push('<div class="flex items-center gap-1.5 text-pink-300"><span>○</span> 多邻国未完成</div>');
  $('#overviewStatus').innerHTML=sl.join('');
}

// ==================== 彩纸 ====================
let confettiCtx=null;
function initConfetti(){
  const canvas=$('#confettiCanvas');
  confettiCtx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth*window.devicePixelRatio;canvas.height=window.innerHeight*window.devicePixelRatio;canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';confettiCtx.scale(window.devicePixelRatio,window.devicePixelRatio);}
  resize();window.addEventListener('resize',resize);
}
function confetti(){
  if(!confettiCtx)return;
  const canvas=$('#confettiCanvas');canvas.style.display='block';
  const particles=[];
  for(let i=0;i<80;i++)particles.push({x:window.innerWidth/2+(Math.random()-0.5)*100,y:window.innerHeight/2-50,vx:(Math.random()-0.5)*16,vy:Math.random()*-12-4,gravity:0.35,size:Math.random()*8+4,color:CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],rotation:Math.random()*360,rotationSpeed:(Math.random()-0.5)*20,life:1,shape:Math.random()>0.5?'rect':'circle'});
  let frame=0;
  function animate(){
    confettiCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=0.98;p.rotation+=p.rotationSpeed;p.life=Math.max(0,1-frame/120);confettiCtx.save();confettiCtx.translate(p.x,p.y);confettiCtx.rotate(p.rotation*Math.PI/180);confettiCtx.globalAlpha=p.life;confettiCtx.fillStyle=p.color;if(p.shape==='rect')confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.4);else{confettiCtx.beginPath();confettiCtx.arc(0,0,p.size/2,0,Math.PI*2);confettiCtx.fill();}confettiCtx.restore();});
    frame++;if(frame<120)requestAnimationFrame(animate);else{confettiCtx.clearRect(0,0,window.innerWidth,window.innerHeight);canvas.style.display='none';}
  }
  animate();
}
